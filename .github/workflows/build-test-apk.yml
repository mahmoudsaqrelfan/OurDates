name: Build Test APK on: 
  push:
    branches: - 
      local-first-google-linking
  workflow_dispatch: 
jobs:
  build: runs-on: 
    ubuntu-latest steps:
      - name: Checkout 
      repository
        uses: 
        actions/checkout@v4
      - name: Set up JDK 
      17
        uses: 
        actions/setup-java@v4 
        with:
          distribution: 
          temurin 
          java-version: 
          '17'
      - name: Set up 
      Android SDK
        uses: 
        android-actions/setup-android@v3
      - name: Restore 
      google-services.json
        run: | echo "${{ 
          secrets.GOOGLE_SERVICES_JSON_B64 
          }}" | base64 
          --decode > 
          app/google-services.json
      - name: Restore 
      release keystore
        run: | echo "${{ 
          secrets.RELEASE_KEYSTORE_B64 
          }}" | base64 
          --decode > 
          my-upload-key.jks
      - name: Make 
      Gradle executable
        run: chmod +x 
        gradlew
      - name: Build 
      signed release APK
        env: 
          KEYSTORE_PATH: 
          ${{ 
          github.workspace 
          }}/my-upload-key.jks
          STORE_PASSWORD: 
          ${{ 
          secrets.STORE_PASSWORD 
          }}
          KEY_PASSWORD: 
          ${{ 
          secrets.KEY_PASSWORD 
          }}
        run: | ./gradlew 
          assembleRelease 
          \
            --no-daemon 
            \ 
            --no-configuration-cache 
            \ 
            -Dorg.gradle.jvmargs="-Xmx2g 
            -XX:MaxMetaspaceSize=512m"
      - name: Upload APK 
        uses: 
        actions/upload-artifact@v4 
        with:
          name: 
          Mawaeedna-Test-APK 
          path: 
          app/build/outputs/apk/release/app-release.apk 
          if-no-files-found: 
          error
          retention-days: 7
